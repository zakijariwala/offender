ShortDescription: A desktop monitor that tells you what is slowing your machine down.
Description: |-
  Offender is an ambient Windows desktop monitor. It idles as a small notch in the corner
  of the screen showing CPU, memory and network at a glance, and expands to a full panel
  on hover with disk, GPU and a ranked list of the processes actually costing you
  resources.

  Processes are aggregated by image name, so a browser's helper processes appear as one
  row, and scored on a weighted composite of CPU time, memory footprint and disk I/O.

  It is a single self-contained executable compiled with NativeAOT, roughly 2 MB, with no
  .NET runtime dependency. It uses about 7 MB of memory and 0.04% CPU. Nothing it reads
  requires administrator rights, and it makes no network connections.

